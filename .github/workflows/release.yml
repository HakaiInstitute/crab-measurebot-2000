name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: CrabMeasureBot2000-windows.exe
          - os: macos-latest
            artifact_name: CrabMeasureBot2000-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install project dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller pyinstaller-hooks-contrib

      # ── macOS: build .icns from the committed PNG ──────────────────────────
      - name: Build icon (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size resources/megalopa-icon-1024.png --out icon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double resources/megalopa-icon-1024.png --out icon.iconset/icon_${size}x${size}@2x.png
          done
          sips -z 1024 1024 resources/megalopa-icon-1024.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      # ── Windows: convert PNG to .ico using Pillow ──────────────────────────
      - name: Build icon (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install pillow
          python -c "
          from PIL import Image
          img = Image.open('resources/megalopa-icon-1024.png').convert('RGBA')
          sizes = [(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]
          img.save('icon.ico', format='ICO', sizes=sizes)
          "

      # macOS uses --onedir so the .app bundle stays intact, then gets zipped
      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller \
            --onedir \
            --windowed \
            --name CrabMeasureBot2000 \
            --icon icon.icns \
            --paths src \
            --collect-all tortoise \
            --collect-all aiosqlite \
            --hidden-import qasync \
            src/crab_measurebot_2000/__main__.py

      - name: Zip .app bundle (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/CrabMeasureBot2000.app CrabMeasureBot2000-macos.zip

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller `
            --onefile `
            --windowed `
            --name CrabMeasureBot2000 `
            --icon icon.ico `
            --paths src `
            --collect-all tortoise `
            --collect-all aiosqlite `
            --hidden-import qasync `
            src/crab_measurebot_2000/__main__.py

      - name: Copy Windows executable
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: cp dist/CrabMeasureBot2000.exe "$ARTIFACT_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: artifacts/*
